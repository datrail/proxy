# Lint and format configuration. `make lint` and CI read this same file, so both
# run the same rules with the same settings.
#
# Ruff's default rule set, minus the two named below. Curating one is an
# argument every one of the datrail components would have to have again, so the
# default is the starting point and every departure from it carries its reason.
#
# The two ignores are load-bearing, and the cheap way of checking says they are
# not: `--config 'lint.ignore=[]'` merges rather than replaces, so it reports a
# clean tree either way. Deleting the block from this file and running
# `ruff check` is the test that answers.

# The lowest interpreter this project supports, not the one the image ships.
# The target must track the floor: set it higher and `ruff check --fix` rewrites
# working code into forms that only parse on the newer version, which CI running
# a single newer interpreter never notices.
target-version = "py310"

[lint]
# BLE001 (blind `except Exception`) is off by decision, not oversight, at each
# of its three sites. `TicketHolder.refresh_once` catches everything because
# refreshing is never fatal — the proxy serves without a ticket, and an issuer
# can fail in as many ways as httpx, json and asyncio have exceptions.
# `TicketHolder.aclose` catches everything the refresh loop failed with, because
# it is called from a `finally` and must not replace a shutdown with the
# traceback of a task nobody awaited. `RedactingFilter.filter`
# catches everything because it must never raise into the call that logged.
# Narrowing any of them would change behaviour under cover of a style fix.
#
# TRY004 (prefer TypeError for an invalid type) is wrong here. Every site it
# fires on is validating a response from another service — a non-ISO
# `expires_at`, a body that is not a JSON object, a `tickets` that is not a
# list, an entry in it that is not a mapping. That is bad data, not a caller passing the wrong type, and bad data
# raises ValueError throughout this module, which the tests assert.
# `NoTicketAvailable` is not a counterexample: it is the issuer's authoritative
# "no ticket exists", a distinct outcome that must never be conflatable with
# malformed data, because the two demand opposite handling.
ignore = ["BLE001", "TRY004"]
