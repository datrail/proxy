# The e2e stack's Envoy config for proxy-envoy-grpc over ext_proc, written for
# Envoy v1.39. envoy.yaml is the same over ext_authz; use one or the other.
#
# It holds no Rail configuration: which hosts are protected, and the ticket,
# are the extension's alone. Envoy sends every request's headers to the
# extension, which answers with the x-rail headers to set or remove, and, for a
# protected host, which route to take (`x-rail-upstream`) and where to connect
# (`:authority`).
#
# The agent sends plain HTTP to the listener, with the target in `Host`.

static_resources:
  listeners:
    - name: agent
      # 0.0.0.0 because the driver calls each Envoy across this stack's network. A
      # deployment beside its agent binds 127.0.0.1: proxy-envoy-grpc/README.md says why.
      address:
        socket_address: { address: 0.0.0.0, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: agent
                codec_type: AUTO
                # No strip_any_host_port: the agent's port must reach the
                # extension, and the upstream when the extension keeps it.
                # Envoy adds none of its own request headers upstream.
                generate_request_id: false
                skip_xff_append: true
                # Many servers read `_` in a header name as `-`, so `x_rail`
                # would reach one as `x-rail`. Any header with one is dropped.
                common_http_protocol_options:
                  headers_with_underscores_action: DROP_HEADER
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        # No request headers, so never `x-rail`. The transport
                        # failure reason says why an upstream connection failed,
                        # e.g. a certificate that doesn't match.
                        text_format_source:
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %RESPONSE_CODE% %RESPONSE_FLAGS% %UPSTREAM_CLUSTER% %UPSTREAM_HOST% %UPSTREAM_TRANSPORT_FAILURE_REASON%\n"
                route_config:
                  name: agent
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        # Protected, over HTTPS, as the extension decided.
                        - match:
                            prefix: /
                            headers:
                              - name: x-rail-upstream
                                string_match: { exact: tls }
                          route: { cluster: rail_tls, timeout: 0s }
                          request_headers_to_remove: [x-rail-upstream]
                        # Protected, over plain HTTP, as its entry says.
                        - match:
                            prefix: /
                            headers:
                              - name: x-rail-upstream
                                string_match: { exact: plain }
                          route: { cluster: rail_plain, timeout: 0s }
                          request_headers_to_remove: [x-rail-upstream]
                        # Everything else, as the agent sent it.
                        - match: { prefix: / }
                          route: { cluster: rail_plain, timeout: 0s }
                http_filters:
                  # The agent's x-rail headers are removed before the callout,
                  # so they never cross even when the extension is down.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove_on_match:
                              key_matcher: { exact: x-rail }
                          - remove_on_match:
                              key_matcher: { prefix: x-rail- }
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      # The extension being down never stops a request.
                      failure_mode_allow: true
                      # The request's headers only. A body rule needs a body
                      # mode here; the extension never asks for one itself.
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                      # Let the extension rewrite `:authority`. The route is
                      # picked again from the header it set, as it asks.
                      mutation_rules:
                        allow_all_routing: true
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: { name: rail_dns, dns_lookup_family: V4_PREFERRED }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true

  clusters:
    # The extension, on the unix socket it binds.
    - name: rail_ext
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: rail_ext
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /run/rail/ext.sock }

    # Protected hosts over HTTPS: the host in `:authority`, at its port or 443.
    # SNI and the certificate check follow the host.
    - name: rail_tls
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: { name: rail_dns, dns_lookup_family: V4_PREFERRED }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_http_protocol_options: { auto_sni: true, auto_san_validation: true }
          explicit_http_config: { http_protocol_options: {} }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }

    # Everything over plain HTTP: the host in `:authority`, at its port or 80.
    - name: rail_plain
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: { name: rail_dns, dns_lookup_family: V4_PREFERRED }
