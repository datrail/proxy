# The e2e stack's Envoy for what the example configs don't do, written for
# Envoy v1.39. Never an example: each listener is one variant.
#
#   15001        both callouts in one chain, ext_authz then ext_proc
#   15011-15015  ext_proc in each body mode, sending every request to the
#                driver's recording server, which shows what reached it
#
# Every listener calls `ext-judged`, whose judge the agent steers with
# `x-e2e-judge` (judge.py).

static_resources:
  listeners:
    - name: both
      address:
        socket_address: { address: 0.0.0.0, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: both
                codec_type: AUTO
                generate_request_id: false
                skip_xff_append: true
                common_http_protocol_options:
                  headers_with_underscores_action: DROP_HEADER
                route_config: &routes
                  name: agent
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                            headers:
                              - name: x-rail-upstream
                                string_match: { exact: tls }
                          route: { cluster: rail_tls, timeout: 0s }
                          request_headers_to_remove: [x-rail-upstream]
                        - match:
                            prefix: /
                            headers:
                              - name: x-rail-upstream
                                string_match: { exact: plain }
                          route: { cluster: rail_plain, timeout: 0s }
                          request_headers_to_remove: [x-rail-upstream]
                        - match: { prefix: / }
                          route: { cluster: rail_plain, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove_on_match:
                              key_matcher: { exact: x-rail }
                          - remove_on_match:
                              key_matcher: { prefix: x-rail- }
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                        timeout: 1s
                      failure_mode_allow: true
                      clear_route_cache: true
                      decoder_header_mutation_rules:
                        allow_all_routing: true
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      failure_mode_allow: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                      mutation_rules:
                        allow_all_routing: true
                  - &forward
                    name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: { name: rail_dns, dns_lookup_family: V4_PREFERRED }
                  - &router
                    name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true

    # One listener per body mode. `message_timeout` is raised, as a deployment
    # with body rules raises it: the extension holds each part of the body
    # until the verdict, and the driver uploads it slowly.
    - name: buffered
      address:
        socket_address: { address: 0.0.0.0, port_value: 15011 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: buffered
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      message_timeout: 5s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                  - *forward
                  - *router

    - name: buffered-partial
      address:
        socket_address: { address: 0.0.0.0, port_value: 15012 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: buffered_partial
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      message_timeout: 5s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED_PARTIAL
                  - *forward
                  - *router

    - name: streamed
      address:
        socket_address: { address: 0.0.0.0, port_value: 15013 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: streamed
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      message_timeout: 5s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: STREAMED
                  - *forward
                  - *router

    - name: streamed-without-waiting
      address:
        socket_address: { address: 0.0.0.0, port_value: 15014 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: streamed_without_waiting
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      message_timeout: 5s
                      send_body_without_waiting_for_header_response: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: STREAMED
                  - *forward
                  - *router

    - name: full-duplex
      address:
        socket_address: { address: 0.0.0.0, port_value: 15015 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: full_duplex
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      message_timeout: 5s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: FULL_DUPLEX_STREAMED
                        # Envoy requires it with this body mode.
                        request_trailer_mode: SEND
                  - *forward
                  - *router

  clusters:
    - name: rail_ext
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: rail_ext
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /run/rail/ext.sock }

    - name: rail_tls
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: { name: rail_dns, dns_lookup_family: V4_PREFERRED }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_http_protocol_options: { auto_sni: true, auto_san_validation: true }
          explicit_http_config: { http_protocol_options: {} }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }

    - name: rail_plain
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: { name: rail_dns, dns_lookup_family: V4_PREFERRED }
