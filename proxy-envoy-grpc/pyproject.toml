[project]
name = "proxy-envoy-grpc"
version = "0"  # never published; the image is versioned by its git tag
description = "DatRail Proxy's Envoy gRPC extension service."
requires-python = ">=3.12"
dependencies = [
    "proxy-core",
    "grpcio==1.84.0",
    # The generated Envoy protobufs, so there is no codegen step.
    "xds-protos==1.84.0",
]

[tool.uv.sources]
proxy-core = { workspace = true }

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "proxy.envoy_grpc"
