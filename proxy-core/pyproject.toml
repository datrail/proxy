[project]
name = "proxy-core"
version = "0"  # never published; the image is versioned by its git tag
description = "DatRail Proxy's vendor-neutral core: x-rail ticket lifecycle and injection."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
]

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/proxy/ has no __init__.py: `proxy` is a namespace shared by every member.
module-name = "proxy.core"
