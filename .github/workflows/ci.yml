name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Callable so a release can gate on it. Without this the only triggers are a
  # pull request and a push to master, and a tag can sit on a commit that saw
  # neither.
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to check. Defaults to the triggering ref."
        required: false
        type: string

permissions:
  contents: read

# Every uv command fails if uv.lock does not match the pyproject.toml files.
env:
  UV_LOCKED: "1"

jobs:
  lint:
    # Named, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 to
    # 11-19, run by run (actions/runner-images#14748). Move on purpose (DR-133).
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The uv the Dockerfile uses; exact tag, since setup-uv publishes no major
      # tags from v8. It installs Python from `.python-version` and caches it.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          cache-python: true

      - run: make init
      - run: make lint

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          cache-python: true

      - run: make init
      - run: make test

  # Builds and runs each image against stubs, which the unit suite, running
  # in-process, can't: the container starts, binds and completes a handshake.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [standalone, envoy-grpc]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4

      # Compose can't reach the GHA cache, so build here first; compose's own
      # build then finds every layer in this builder. The scope is shared with
      # container-release.yml: keep the names in step.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy-${{ matrix.stack }}/Dockerfile
          push: false
          cache-from: type=gha,scope=image-${{ matrix.stack }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.stack }}

      - run: make e2e-${{ matrix.stack }}

      - if: failure()
        run: docker compose -f e2e/${{ matrix.stack }}/compose.yml logs --no-color

  # The check the ruleset requires, in place of one per stack. always(): a
  # failed stack would otherwise skip it, and a skipped check counts as passing.
  e2e-passed:
    needs: e2e
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: needs.e2e.result != 'success'
        run: exit 1
