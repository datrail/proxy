name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Callable so a release can gate on it. Without this the only triggers are a
  # pull request and a push to master, and a tag can sit on a commit that saw
  # neither.
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to check. Defaults to the triggering ref."
        required: false
        type: string

permissions:
  contents: read

# Every uv command fails if uv.lock does not match the pyproject.toml files.
env:
  UV_LOCKED: "1"

jobs:
  lint:
    # Named, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 to
    # 11-19, run by run (actions/runner-images#14748). Move on purpose (DR-133).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The uv the Dockerfile uses; exact tag, since setup-uv publishes no major
      # tags from v8. It installs Python from `.python-version` and caches it.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          cache-python: true

      - run: make init
      - run: make lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          cache-python: true

      - run: make init
      - run: make test

  # A build failure should surface on the pull request rather than on the tag
  # that publishes it. container-release.yml calls this whole workflow before it
  # pushes anything, so this job runs on both paths.
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4

      # Build-only, amd64 only: arm64 would answer "does it build" no differently.
      # Context is the repo root, for uv.lock; Dockerfile.dockerignore limits what
      # is sent. Scope shared with container-release.yml: keep the names in step.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy-standalone/Dockerfile
          push: false
          cache-from: type=gha,scope=image-standalone
          cache-to: type=gha,mode=max,scope=image-standalone

  # The only job that runs the image rather than building it: the stack in e2e/
  # brings up this proxy against a stubbed control plane and a stubbed upstream
  # and asserts what reached the wire. The unit suite drives the application
  # in-process, so nothing else here proves the container starts, binds a real
  # port, or completes a real handshake.
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4

      # Compose builds the image itself; --exit-code-from makes the driver's
      # verdict the job's.
      - run: make e2e

      # The stack is worth nothing if a failure is invisible, and the driver's
      # own output scrolls past on a green run.
      - if: failure()
        run: docker compose -f e2e/compose.yml logs --no-color
