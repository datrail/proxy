name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt pins ruff exactly, so this runs the same tool at the
      # same version a contributor runs locally.
      - run: pip install -r requirements-dev.txt

      # `ruff check` plus `ruff format --check`, per the Makefile.
      - run: make lint
