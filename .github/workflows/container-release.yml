# Build and publish versioned container images to GitHub Packages (ghcr.io).
#
# `git tag v0.1.0 && git push --tags` publishes :0.1.0, :0.1 and :latest of
# every image in `publish`, multi-arch, each with an SBOM and a signed
# build-provenance attestation. Standalone publishes as the repository's name,
# which deployments pull.
name: Release Container Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# Per repository, not per ref: two tags publishing at once would race to write
# `:0.1` and `:latest`.
concurrency:
  group: container-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Resolved in its own job so the release can be gated on the suite: a
  # job-level `uses:` reads another job's outputs, and cannot read a step's.
  version:
    # Named, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 to
    # 11-19, run by run (actions/runner-images#14748). Move on purpose (DR-133).
    runs-on: ubuntu-26.04
    # Nothing here touches the repository or the registry; the workflow-level
    # grants exist for `publish`.
    permissions: {}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      # Refuse anything but vMAJOR.MINOR.PATCH: the `v*` glob also matches `v1`
      # and `vfoo`, and a manual run would otherwise tag the branch it was
      # launched from, moving `latest` either way.
      - id: resolve
        env:
          RAW_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW_REF' is not a vMAJOR.MINOR.PATCH release tag; refusing to publish."
            exit 1
          fi
          echo "tag=$RAW_REF" >> "$GITHUB_OUTPUT"
          # A prerelease must not move `latest` — someone pulling the
          # unqualified name is asking for the newest stable build.
          if [[ "$RAW_REF" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  # Never publish an untested version: the suite runs on the tag itself.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, ci]
    runs-on: ubuntu-26.04
    # One entry per image, as in ci.yml. Not fail-fast: a cancelled job doesn't
    # unpublish, and rerunning the failed entry completes the release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: standalone
            image: ghcr.io/${{ github.repository }}
          - stack: envoy-grpc
            image: ghcr.io/${{ github.repository }}-envoy-grpc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      # The tag's commit: on a manual run, `github.sha` is the branch it was
      # launched from, not what was built.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          # `value=` pins every tag to the version resolved above, so a manual
          # dispatch tags what it built rather than what it was launched from.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy-${{ matrix.stack }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          # Off: the signed attestation below replaces buildx's unsigned provenance.
          provenance: false
          # Shared with ci.yml's e2e job, so a release reuses its amd64 layers:
          # keep the scope names in step.
          cache-from: type=gha,scope=image-${{ matrix.stack }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.stack }}

      # Checked with `gh attestation verify oci://<image>:<tag> --owner <org>`.
      # Warns rather than fails: the image is already pushed. A manual run
      # attests its own ref, not the tag; the image labels carry the commit.
      - id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Off: it needs `artifact-metadata: write`, and verification doesn't
          # read it.
          create-storage-record: false

      # Values reach the shell through env, never through `${{ }}` inside run:,
      # which is substituted as raw text before bash sees it.
      - if: steps.attest.outcome == 'failure'
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "::warning::$IMAGE published without a provenance attestation — attestations need a public repository, or GitHub Enterprise Cloud."

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published $IMAGE"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
